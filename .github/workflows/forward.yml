name: Olmaliq News Forwarder (24/7)

on:
  schedule:
    - cron: "*/5 * * * *"    # Har 5 daqiqada avtomatik tekshiradi
  workflow_dispatch:
    inputs:
      catchup:
        description: "Eski xabarlarni tashlab, faqat yangilaridan boshlash"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: olmaliq-bot-single-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Repozitoriyani yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.11 ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Yangiliklarni tekshirish va joylash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL || '@olmaliqlik' }}
          TARGET_CHANNEL_RU: ${{ secrets.TARGET_CHANNEL_RU || '-1002262312107' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION || secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING || secrets.TELEGRAM_SESSION }}
        run: |
          if [ "${{ github.event.inputs.catchup }}" = "true" ]; then
            python main.py --catchup
          else
            python main.py
          fi

      - name: Ma'lumotlar bazasini saqlab qolish
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git config --global user.name "olmaliq-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/bot_database.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: yangilangan bot bazasi [skip ci]"
            git pull --rebase origin main
            git push
            echo "--- BAZA GITHUBGA SAQLANDI ---"
          else
            echo "--- O'ZGARISH YO'Q, COMMIT QILINMADI ---"
          fi
